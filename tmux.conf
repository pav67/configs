# ~/.tmux.conf
# Configuration tmux - session persistante / multi-device

##### Historique / souris #####

# Gros historique par pane
set -g history-limit 100000

# Souris : scrollback, sélection de pane, redimensionnement, etc.
set -g mouse on

# Navigation plus naturelle dans le mode copie
setw -g mode-keys vi

##### Indexation #####

# Fenêtres et panes à partir de 1
set -g base-index 1
setw -g pane-base-index 1

# Renumérote automatiquement après fermeture d'une fenêtre
set -g renumber-windows on

##### Bindings supplémentaires #####
# Les bindings tmux standards (préfixe Ctrl-b) restent inchangés.

# F2 : nouvelle fenêtre
bind-key -n F2 new-window

# F3 : fenêtre précédente
bind-key -n F3 previous-window

# F4 : fenêtre suivante
bind-key -n F4 next-window

# F10 : tuer la fenêtre courante, avec confirmation
# NOTE : beaucoup de terminaux ne transmettent pas F0 de manière portable.
bind-key -n F10 confirm-before -p "Kill window #W? (y/n)" kill-window

# Variante correspondant à la demande "F0" si le terminal envoie réellement
# une séquence nommée F0. La plupart des terminaux n'ont pas de touche F0.
# bind-key -n F0 confirm-before -p "Kill window #W? (y/n)" kill-window

##### Confort #####

# Évite un délai inutile après Escape (utile avec Vim)
set -sg escape-time 100
# Compatible avec les séquences de touches des terminaux Windows.

# Messages tmux visibles un peu plus longtemps
set -g display-time 1500

# =========================================================
# Thème : bulles grises / Nerd Font
# =========================================================

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=#b8bcbf"

# Session à gauche
set -g status-left ""
set -g status-left-length 0

# Heure à droite, uniquement si le terminal est assez large
set -g status-right-length 20
set -g status-right "#[fg=#404448,bg=default]#[fg=#eeeeee,bg=#404448] %H:%M#[fg=#404448,bg=default] "

# =========================================================
# Titres automatiques
# Shell au repos : dossier ; sinon : commande active
# =========================================================

set -g allow-rename off
set -g automatic-rename on

# Codex : titre fourni par l'application, avec son animation
# Autres programmes : nom de la commande, y compris zsh au repos
set -g automatic-rename-format "#{?#{==:#{pane_current_command},codex},#{=1:pane_title} codex,#{pane_current_command}}"

# Enregistrer les alertes sans émettre de son
set -g monitor-bell on
set -g bell-action none
set -g visual-bell off

# Conserver le thème gris lors d'une alerte
set -g window-status-bell-style "fg=#eeeeee,bg=default"


# Titre du terminal, si le terminal autorise sa modification
set -g set-titles on
set -g set-titles-string "#W"

# =========================================================
# Fenêtres : bulles séparées
# =========================================================

set -g window-status-separator " "
set -g window-status-style "fg=#c0c4c8,bg=default,none"
set -g window-status-current-style "fg=#202428,bg=default,none"

# Fenêtres inactives
set -g window-status-format "#[fg=#404448,bg=default]#[fg=#c0c4c8,bg=#404448]#I · #W#{?window_bell_flag, 󰂚,}#[fg=#404448,bg=default]"

# Fenêtre active, avec indicateur de zoom
set -g window-status-current-format "#[fg=#a0a4a8,bg=default]#[fg=#202428,bg=#a0a4a8,bold]#I · #W#{?window_zoomed_flag, 󰊓,}#[fg=#a0a4a8,bg=default,nobold]"

# =========================================================
# Bordures et messages
# =========================================================

set -g pane-border-style "fg=#404448"
set -g pane-active-border-style "fg=#a0a4a8"

set -g message-style "fg=#eeeeee,bg=#404448"
set -g message-command-style "fg=#eeeeee,bg=#404448"
set -g mode-style "fg=#202428,bg=#a0a4a8"

set -g display-panes-colour "#606468"
set -g display-panes-active-colour "#eeeeee"
set -g clock-mode-colour "#a0a4a8"
