# ~/.tmux.conf
# Configuration tmux - session persistante / multi-device

##### Historique / souris #####

# Gros historique par pane
set -g history-limit 100000

# Souris : scrollback, sélection de pane, redimensionnement, etc.
set -g mouse on

# Navigation plus naturelle dans le mode copie
setw -g mode-keys vi

##### Indexation #####

# Fenêtres et panes à partir de 1
set -g base-index 1
setw -g pane-base-index 1

# Renumérote automatiquement après fermeture d'une fenêtre
set -g renumber-windows on

##### Bindings supplémentaires #####
# Les bindings tmux standards (préfixe Ctrl-b) restent inchangés.

# F2 : nouvelle fenêtre
bind-key -n F2 new-window

# F3 : fenêtre précédente
bind-key -n F3 previous-window

# F4 : fenêtre suivante
bind-key -n F4 next-window

# F10 : tuer la fenêtre courante, avec confirmation
# NOTE : beaucoup de terminaux ne transmettent pas F0 de manière portable.
bind-key -n F10 confirm-before -p "Kill window #W? (y/n)" kill-window

# Variante correspondant à la demande "F0" si le terminal envoie réellement
# une séquence nommée F0. La plupart des terminaux n'ont pas de touche F0.
# bind-key -n F0 confirm-before -p "Kill window #W? (y/n)" kill-window

##### Confort #####

# Évite un délai inutile après Escape (utile avec Vim)
set -sg escape-time 100
# passage à 100 permet de pas avoir les caractères superflus au login depuis un poste windows

# Messages tmux visibles un peu plus longtemps
set -g display-time 1500

# Utiliser Zsh dans toutes les nouvelles fenêtres tmux
set-option -g default-shell /usr/bin/zsh

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
