

# Configuration personnelle de Paul

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = env GTK_THEME=Adwaita:dark thunar
$menu = @HOME@/.local/bin/lanceur-applications

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, C, exec, @HOME@/.local/bin/ouvrir-navigateur
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, SPACE, exec, $menu

# Clavier français AZERTY
input {
    kb_layout = fr
    kb_variant = latin9
    numlock_by_default = true
    # Keychron en mode Win : modificateurs standard
    kb_options =
}

# Barre de statut
exec-once = waybar

# Navigation et disposition des fenêtres
bind = $mainMod, left, movefocus, l
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod, right, movefocus, r
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod, up, movefocus, u
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, down, movewindow, d
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40
bind = $mainMod, F, fullscreen, 0
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Écrans : adaptation automatique, personnalisable dans monitors.conf
source = @HOME@/.config/hypr/monitors.conf

# Masquer la phrase affichée sur le fond par défaut
misc {
    disable_splash_rendering = true
    # Réveiller les écrans même si hypridle manque son événement de reprise.
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# Fond d’écran personnel
exec-once = swaybg -i "@HOME@/.local/share/backgrounds/voie-lactee.png" -m fill

# Verrouillage de la session
bind = $mainMod, L, exec, hyprlock

# Gestion de l’inactivité et extinction des écrans
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start hypridle.service

# Captures d’écran : fichier PNG et presse-papiers
bind = , Print, exec, @HOME@/.local/bin/capture-ecran all
bind = $mainMod SHIFT, S, exec, @HOME@/.local/bin/capture-ecran area

# Historique du presse-papiers
bind = $mainMod, V, exec, @HOME@/.local/bin/historique-presse-papiers
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE && systemctl --user start clipboard-history.service

# Emails Outlook détachés : flottants après chargement du titre
exec-once = @HOME@/.local/bin/outlook-flottant

# Panneau audio ouvert depuis Waybar : flottant et centré
windowrule = match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$, float on, size 900 650, center on
