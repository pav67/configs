# Verrouillage assorti au bureau : voie lactée et lavande

general {
    hide_cursor = true
}

background {
    monitor =
    path = @HOME@/.local/share/backgrounds/voie-lactee.png
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 88
    font_family = Noto Sans
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = Session de $USER
    color = rgb(cdd6f4)
    font_size = 20
    font_family = Noto Sans
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    outer_color = rgb(cba6f7)
    inner_color = rgba(1e1e2eee)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    font_family = Noto Sans
    placeholder_text = Mot de passe de session
    fail_text = Mot de passe incorrect
    fade_on_empty = false
    rounding = 16
    position = 0, -20
    halign = center
    valign = center
}
