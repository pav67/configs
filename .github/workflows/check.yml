name: Shell kit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install check tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - name: Install check tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Syntax and ShellCheck
        run: |
          bash -n install.sh
          zsh -n zshrc
          shellcheck -x install.sh lib/*.sh profile-snippet.sh tmux/*.sh
      - name: Installer and themes
        run: |
          python3 tests/check_install.py
          python3 tests/check_theme.py
          python3 tests/check_native_identity.py
          python3 tests/check_auto_attach.py
          python3 tests/check_install_ui.py
