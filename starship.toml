add_newline = false

format = "$username$hostname$directory$git_branch$git_status$cmd_duration$character"

# Utilisateur — gris foncé
[username]
show_always = true
style_user = "fg:#eeeeee bg:#303438"
style_root = "bold fg:#ff8080 bg:#303438"
format = "[](fg:#303438)[ $user]($style)[](fg:#303438) "

# Serveur — gris légèrement plus clair
[hostname]
ssh_only = false
trim_at = "."
style = "fg:#eeeeee bg:#404448"
format = "[](fg:#404448)[󰒋 $hostname]($style)[](fg:#404448) "

# Dossier — gris moyen
[directory]
style = "fg:#ffffff bg:#505458"
read_only_style = "fg:#ffaaaa bg:#505458"
format = "[](fg:#505458)[ $path]($style)[$read_only]($read_only_style)[](fg:#505458) "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "

# Branche Git — gris intermédiaire
[git_branch]
symbol = " "
style = "fg:#ffffff bg:#606468"
format = "[](fg:#606468)[$symbol$branch]($style)[](fg:#606468) "

# État Git — bulle masquée si aucun état à signaler
[git_status]
style = "fg:#ffffff bg:#707478"
format = '([](fg:#707478)[$all_status$ahead_behind]($style)[](fg:#707478) )'
conflicted = '=${count} '
modified = '!${count} '
untracked = '?${count} '
staged = '+${count} '
renamed = 'R${count} '
deleted = '-${count} '
stashed = '*${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '

# Durée — gris clair, visible à partir de 2 secondes
[cmd_duration]
min_time = 2000
style = "fg:#202428 bg:#a0a4a8"
format = "[](fg:#a0a4a8)[󱎫 $duration]($style)[](fg:#a0a4a8) "

# Saisie — couleur selon le résultat et le mode Vim
[character]
success_symbol = "[❯](bold fg:#b8bcbf)"
error_symbol = "[❯](bold fg:#ff7070)"
vimcmd_symbol = "[❮](bold fg:#e5c07b)"
