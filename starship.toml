# Minimal pastel prompt: no backgrounds, bubbles or repeated identity.
add_newline = false
format = "$directory$git_branch$git_status$cmd_duration$character"

[directory]
style = "bold fg:#89b4fa"
read_only_style = "fg:#f38ba8"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " ro"

[git_branch]
symbol = ""
style = "fg:#cba6f7"
format = "[on](fg:#6c7086) [$branch]($style) "

[git_status]
style = "fg:#f9e2af"
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count} '
modified = '!${count} '
untracked = '?${count} '
staged = '+${count} '
renamed = 'R${count} '
deleted = '-${count} '
stashed = '*${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇡${ahead_count}⇣${behind_count} '

[cmd_duration]
min_time = 2000
style = "fg:#9399b2"
format = "[· $duration]($style) "

[character]
success_symbol = "[❯](bold fg:#a6e3a1)"
error_symbol = "[❯](bold fg:#f38ba8)"
vimcmd_symbol = "[❮](bold fg:#f9e2af)"
vimcmd_replace_one_symbol = "[❮](bold fg:#fab387)"
vimcmd_replace_symbol = "[❮](bold fg:#fab387)"
vimcmd_visual_symbol = "[❮](bold fg:#cba6f7)"
